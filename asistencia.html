<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Asistencia - KFL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Arial, sans-serif; font-size: 16px; }
  </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

  <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-md p-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-[#19547E]">Control de Asistencia KFL</h1>
        <p class="text-xs text-gray-500 mt-1">Última actualización: <span id="fecha-actualizacion"></span></p>
      </div>
      <div class="flex items-center gap-4">
        <span class="bg-[#E0F2FE] text-[#19547E] font-bold px-4 py-2 rounded-full text-sm border border-[#19547E]">
          Registrados: <span id="total-count">0</span> | Asistieron: <span id="asistieron-count">0</span>
        </span>
      </div>
    </div>

    <!-- Filtros -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mb-6 bg-[#f4f4f4] p-4 rounded-md border border-gray-200">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Buscar (Nombre/Correo)</label>
        <input type="text" id="search-input" placeholder="Buscar..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#19547E]">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Equipo ↕</label>
        <select id="filter-equipo" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#19547E]">
          <option value="">Todos los equipos</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Categoría ↕</label>
        <select id="filter-categoria" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#19547E]">
          <option value="">Todas las categorías</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Estado Asistencia</label>
        <select id="filter-asistencia" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#19547E]">
          <option value="">Todos</option>
          <option value="si">Asistió</option>
          <option value="no">No asistió</option>
        </select>
      </div>
    </div>

    <!-- Tabla KFL -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse" style="table-layout: fixed;">
        <thead>
          <tr class="bg-[#19547E] text-white text-base font-bold select-none">
            <th class="p-3 text-center" style="width: 60px;"># ↕</th>
            <th class="p-3 text-center" style="width: 250px;">Jugador / Asistente ↕</th>
            <th class="p-3 text-center" style="width: 160px;">Equipo ↕</th>
            <th class="p-3 text-center" style="width: 150px;">Categoría ↕</th>
            <th class="p-3 text-center" style="width: 240px;">Correo</th>
            <th class="p-3 text-center" style="width: 140px;">WhatsApp</th>
            <th class="p-3 text-center" style="width: 110px;">Asistió ↕</th>
          </tr>
        </thead>
        <tbody id="table-body" class="text-base">
          <!-- Carga dinámica -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById('fecha-actualizacion').textContent = new Date().toLocaleString('es-PA', {
        dateStyle: '
